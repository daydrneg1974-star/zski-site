# Проверка, что HTML в корне собран из актуальных исходников src/ (python3 src/build.py --check).
# Эти же проверки выполняются перед публикацией в pages.yml.
name: Check build
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tools/check.sh

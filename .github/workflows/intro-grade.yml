name: Experimental intro video grade
on:
  push:
    branches: [experiment/ai-design-toolkit-v1]
    paths:
      - .github/workflows/intro-grade.yml
      - tools/grade_intro.sh
permissions:
  contents: write
concurrency:
  group: zski-intro-grade
  cancel-in-progress: true
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Grade video and verify timeline
        run: bash tools/grade_intro.sh
      - name: Commit isolated alternate video assets
        run: |
          git add video/cinematic/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(video): render separate cinematic intro alternatives"
          # Other workflows may have updated generated HTML while ffmpeg ran.
          # Integrate those non-overlapping commits; never force-push.
          for attempt in 1 2 3; do
            git fetch origin experiment/ai-design-toolkit-v1
            git rebase origin/experiment/ai-design-toolkit-v1
            if git push origin HEAD:experiment/ai-design-toolkit-v1; then exit 0; fi
            sleep 3
          done
          echo "Could not publish graded assets after three attempts" >&2
          exit 1

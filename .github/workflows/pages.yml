# Публикация сайта на GitHub Pages при каждом пуше в main.
# В настройках репозитория: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated HTML
        run: python3 src/build.py --check
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage public site files
        run: |
          mkdir _site
          cp .nojekyll index.html prices.html service.html slopes.html contacts.html intro.html intro-3d.html robots.txt sitemap.xml sw.js _site/
          cp -r css fonts img js video _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

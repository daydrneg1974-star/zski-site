# Публикация сайта на GitHub Pages при каждом пуше в main.
# В настройках репозитория: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application
        run: bash tools/check.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage public site files
        run: |
          python3 tools/stage.py "$RUNNER_TEMP/zski-preview" --preview-url "https://daydrneg1974-star.github.io/zski-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/zski-preview
      - id: deployment
        uses: actions/deploy-pages@v4
